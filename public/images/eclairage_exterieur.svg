<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a0a"/>
      <stop offset="50%" style="stop-color:#004d20"/>
      <stop offset="100%" style="stop-color:#00804d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#00cc55;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#001a0a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="30%" r="35%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#001a0a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow1)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>
  <!-- Path lights -->
  <ellipse cx="200" cy="500" rx="20" ry="20" fill="#ffcc44" opacity="0.9"/>
  <ellipse cx="200" cy="500" rx="50" ry="50" fill="#ffcc44" opacity="0.2"/>
  <ellipse cx="350" cy="450" rx="18" ry="18" fill="#ffcc44" opacity="0.85"/>
  <ellipse cx="500" cy="480" rx="22" ry="22" fill="#ffcc44" opacity="0.9"/>
  <ellipse cx="650" cy="440" rx="18" ry="18" fill="#ffcc44" opacity="0.8"/>
  <!-- Uplight beams on wall -->
  <rect x="100" y="200" width="8" height="250" fill="#00cc55" opacity="0.3" rx="4"/>
  <rect x="600" y="180" width="8" height="270" fill="#00cc55" opacity="0.25" rx="4"/>
  <!-- Stars -->
  <circle cx="400" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="600" cy="120" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="150" cy="100" r="2" fill="white" opacity="0.7"/>
  <!-- Text -->
  <text x="400" y="320" font-family="Georgia, serif" font-size="36" fill="white" text-anchor="middle" opacity="0.9">Éclairage Extérieur</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="16" fill="#00cc55" text-anchor="middle" opacity="0.8">🌿 Jardins · Façades · Allées</text>
</svg>
