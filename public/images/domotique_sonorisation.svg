<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100020"/>
      <stop offset="50%" style="stop-color:#2d0060"/>
      <stop offset="100%" style="stop-color:#4a0080"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8800ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#100020;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- Smart device screen glow -->
  <rect x="250" y="150" width="300" height="200" rx="16" fill="#1a0040" stroke="#8800ff" stroke-width="2" opacity="0.9"/>
  <rect x="270" y="170" width="260" height="160" rx="8" fill="#0d0020" opacity="0.8"/>
  <!-- UI elements on screen -->
  <rect x="280" y="180" width="80" height="12" rx="6" fill="#8800ff" opacity="0.8"/>
  <rect x="280" y="200" width="120" height="8" rx="4" fill="#cc88ff" opacity="0.5"/>
  <circle cx="490" cy="215" r="25" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.8"/>
  <circle cx="490" cy="215" r="15" fill="#00ff88" opacity="0.3"/>
  <!-- Sound waves -->
  <path d="M 100 300 Q 150 250 200 300 Q 250 350 300 300" stroke="#8800ff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 80 300 Q 150 220 220 300 Q 290 380 360 300" stroke="#cc00ff" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Smart bulbs -->
  <circle cx="620" cy="200" r="35" fill="#ffcc00" opacity="0.8"/>
  <ellipse cx="620" cy="235" rx="20" ry="8" fill="#cc9900" opacity="0.7"/>
  <ellipse cx="620" cy="200" rx="35" ry="35" fill="#ffcc00" opacity="0.15"/>
  <!-- Text -->
  <text x="400" y="440" font-family="Georgia, serif" font-size="36" fill="white" text-anchor="middle" opacity="0.9">Domotique &amp; Sonorisation</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="16" fill="#cc88ff" text-anchor="middle" opacity="0.85">🔊 Maison connectée · Audio premium</text>
</svg>
