<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <radialGradient id="light1" cx="50%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="light2" cx="50%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#fffae0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Industrial ceiling -->
  <rect x="0" y="0" width="800" height="60" fill="#111"/>
  <!-- High bay lights -->
  <ellipse cx="200" cy="55" rx="45" ry="18" fill="#e0e0e0"/>
  <ellipse cx="400" cy="55" rx="45" ry="18" fill="#e0e0e0"/>
  <ellipse cx="600" cy="55" rx="45" ry="18" fill="#e0e0e0"/>
  <!-- Light beams -->
  <polygon points="155,73 245,73 320,600 80,600" fill="url(#light1)" opacity="0.15"/>
  <polygon points="355,73 445,73 520,600 280,600" fill="url(#light1)" opacity="0.15"/>
  <polygon points="555,73 645,73 720,600 480,600" fill="url(#light1)" opacity="0.15"/>
  <!-- Floor glow -->
  <ellipse cx="200" cy="550" rx="120" ry="30" fill="#fffae0" opacity="0.3"/>
  <ellipse cx="400" cy="550" rx="120" ry="30" fill="#fffae0" opacity="0.3"/>
  <ellipse cx="600" cy="550" rx="120" ry="30" fill="#fffae0" opacity="0.3"/>
  <!-- Text -->
  <text x="400" y="320" font-family="Georgia, serif" font-size="36" fill="white" text-anchor="middle" opacity="0.9">Éclairage Professionnel</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="16" fill="#c9a84c" text-anchor="middle" opacity="0.85">🏭 Industriel · Commercial · Bureau</text>
</svg>
